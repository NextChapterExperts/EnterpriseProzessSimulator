      summary: "# \ud83c\udfaf Executive Summary & Meeting Pitch\n### SAP Process Simulator & Advisory Suite\n**Dozent & Principal Advisor:** Peter Alexander \u00b7 Next Chapter Experts\n\n---\n\n### 1. Das Kernproblem im Markt\nUnternehmen stehen bei der Digitalisierung und S/4HANA-Transformation vor einem Dilemma:\n* **Entweder \"Blindes Vertrauen in GenAI\":** Teure Cloud-Inferenzkosten, Halluzinationen, regulatorische Risiken (SOX, GoBD) bei schreibenden ERP-Vorg\u00e4ngen.\n* **Oder \"Starre ABAP-Monolithen\":** Klassischer Custom Code (Z-Entwicklungen), der SAP Clean Core verletzt und zuk\u00fcnftige Upgrades blockiert.\n\n### 2. Das L\u00f6sungsversprechen\nDer **SAP Process Simulator** erm\u00f6glicht eine **Pareto-Optimierung**:\n* **100 % deterministische Sicherheit** bei schreibenden Verbuchungen (Clean Core RAP / OData).\n* **Pr\u00e4zise KI-Unterst\u00fctzung** (Observe & Orient) dort, wo unstrukturierte Daten (PDFs, E-Mails, Freitexte) interpretiert werden m\u00fcssen.\n* **Human-in-the-Loop (HITL):** Automatischer Stopp vor risikoreichen Aktionen (Vier-Augen-Prinzip).\n\n### 3. Das methodische Fundament\n1. **OODA-Loop (Boyd):** *Observe* (Wahrnehmen) \u2794 *Orient* (Grounding & Stammdaten) \u2794 *Decide* (Regelpr\u00fcfung) \u2794 *Act* (ERP-Verbuchung).\n2. **6 Kognitive Primitives:** Filter, Extractor, Matcher, Evaluator, Executor, Generator.\n3. **5 Zwingmann-Stufen:** Deterministisch \u2794 Assistant \u2794 Copilot (HITL) \u2794 Autopilot \u2794 Agentic Swarm.\n\n### 4. Status & Meilensteine\n* **v1.0\u2013v1.4 (Live):** OODA-Dekomposition, HITL-Freigabekonsole, interaktive Belegfluss-Simulation, eigener Workflow-Creator, Clean Core Index.\n* **N\u00e4chste Stufen (v2.0+):** Granular Pricing & Token Sizing, Signavio BPMN Import/Export, SAP BTP Live-Bridge.\n\n---\n\ud83d\udc49 **Nutzen Sie den Tab \"Live-Simulator\" oben, um die Suite interaktiv live vorzuf\u00fchren.**\n",
      doku: "# SAP Process Simulator \u2013 Dokumentation\n\nEin fokussiertes Simulations- und Bewertungswerkzeug f\u00fcr SAP-Gesch\u00e4ftsprozesse basierend auf dem **OODA-Loop**, den **6 kognitiven Primitives**, der **Zwingmann-Methodologie** und dem **SAP Clean Core Paradigma**.\n\n---\n\n## \ud83e\udded Inhaltsverzeichnis\n\n1. [Das methodische Fundament](#1-das-methodische-fundament)\n2. [Die 6 Kognitiven Primitives & ihre Pareto-Optimierung](#2-die-6-kognitiven-primitives--ihre-pareto-optimierung)\n3. [Qualitative Effizienz & Vermeidung von Preisspekulation](#3-qualitative-effizienz--vermeidung-von-preisspekulation)\n4. [Step-Boxen, Live-Simulation & Human-in-the-Loop Konsole](#4-step-boxen-live-simulation--human-in-the-loop-konsole)\n5. [Eigener Workflow Creator (`+ Neuer Workflow`)](#5-eigener-workflow-creator--neuer-workflow)\n6. [Zweisprachigkeit (\ud83c\udde9\ud83c\uddea DE / \ud83c\uddec\ud83c\udde7 EN)](#6-zweisprachigkeit--de---en)\n7. [Projekt-Ressourcen, Logfiles & Roadmaps](#7-projekt-ressourcen-logfiles--roadmaps)\n\n---\n\n## 1. Das methodische Fundament\n\nJeder Prozess wird nach zwei standardisierten S\u00e4ulen zerlegt:\n\n### S\u00e4ule 1: Der OODA-Loop (John Boyd) & die 6 Kognitiven Primitives\n1. **\ud83d\udc41\ufe0f 1. OBSERVE (Wahrnehmung & Reizaufnahme):**\n   - `Filter / Gatekeeper`: Triage, Spam-Filter, Relevanzpr\u00fcfung, MIME/Header-Check via SAP Event Mesh.\n   - `Extractor / Transformer`: Strukturierung von unstrukturiertem Freitext/PDF in tabellarische Belegdaten (SAP DOX).\n2. **\ud83e\udded 2. ORIENT (Kontextualisierung & Grounding):**\n   - `Matcher / Enricher`: Stammdatenabgleich gegen SAP (KNA1 Debitor, MARA Material, Vertr\u00e4ge) via SAP HANA Fuzzy Search.\n3. **\u2696\ufe0f 3. DECIDE (Entscheidungsfindung & Regeln):**\n   - `Evaluator / Reasoner`: Deterministische Regelauswertung (Kreditlimit, ATP-Pr\u00fcfung, Toleranzen) via SAP BRFplus.\n4. **\u26a1 4. ACT (Mutation & Synthese):**\n   - `Executor / Actuator`: Schreibende ERP-Verbuchung (Kundenauftrag via ABAP Cloud RAP / OData BAPI).\n   - `Generator / Synthesizer`: Abschlusskommunikation (Auftragsbest\u00e4tigung, Aviso) via SAP BTP Output Management.\n\n### S\u00e4ule 2: Die Zwingmann-Methodologie (Stufen der Automatisierung)\nJeder Schritt kann direkt an der Box auf 5 Stufen eingestellt werden:\n1. **Deterministisch:** Klassisches Regelwerk (BRFplus, SQL). < 50 ms Latenz, 0 CU Inferenz. Ambiguit\u00e4tstoleranz = 0.\n2. **Assistant:** Klassisches ML & Search (SAP HANA Fuzzy Search / RAG / JSON-Mode). 0 Halluzination, rein lesend / vorbereitend im Hintergrund.\n3. **Copilot (Human-in-the-Loop):** Mensch f\u00fchrt, KI schl\u00e4gt vor (z. B. SAP Joule). Der Prozess stoppt zwingend f\u00fcr die menschliche Freigabe (`human_approved: true`).\n   - *Legitime Anwendungsf\u00e4lle f\u00fcr Copilot:*\n     - 1. **Gesetzliche Compliance & Revisionssicherheit (SOX / GoBD):** Vier-Augen-Prinzip vor unwiderruflichen Buchungen.\n     - 2. **Ermessens- & Kulanzentscheidungen:** Menschliche Bewertung bei Goodwill-Regelungen au\u00dferhalb harter Tabellen.\n     - 3. **St\u00fctzr\u00e4der in Phase 1 (Trust & Adoption):** Tempor\u00e4re Absicherung vor der Aktivierung des Autopiloten.\n4. **Autopilot:** Autonomer Single-Agent nach Zwingmann mit Tool-Calling im engen Korridor und Konfidenz-Gate (~90% STP; stoppt nur bei Ausnahmen).\n5. **Agentic:** Multi-Agenten-System mit dynamischen ReAct-Schleifen f\u00fcr komplexe Freitexte und autonome Daten-Selbstheilung (~95% STP).\n\nAusf\u00fchrlicher Leitfaden: Siehe [`docs/METHODIK_SCHULUNGSLEITFADEN.md`](docs/METHODIK_SCHULUNGSLEITFADEN.md).\n\n---\n\n## 2. Die 6 Kognitiven Primitives & ihre Pareto-Optimierung\n\nDie **Pareto-Optimierung** berechnet mit einem Klick das architektonische Optimum, bei dem maximale Dunkelverarbeitung (Straight-Through Processing / STP) bei minimalem Token- und Ressourcenaufwand erzielt wird.\n\nIm Pareto-Optimum wird **kein einziger Schritt auf Copilot gesetzt**, um k\u00fcnstliche Prozessblockaden zu vermeiden:\n\n| OODA-Phase | Kognitives Primitive | Pareto-Archetyp | Konfidenz | Architektonische Begr\u00fcndung |\n|---|---|---|---|---|\n| **Observe** | **Filter / Gatekeeper** | **Deterministisch** | **99%** | Fast-Path via SAP Event Mesh / Header-Regex: 100% Dunkelverarbeitung (STP), 0 Tokens. |\n| **Observe** | **Extractor / Transformer** | **Assistant** (`classic_ml`) | **92%** | SAP DOX / BTP Document Information Extraction im Hintergrund: Strukturierte Extraktion ohne manuelles Abtippen. |\n| **Orient** | **Matcher / Enricher** | **Assistant** (`classic_ml`) | **95%** | SAP HANA Trigram & Fuzzy Search: Stammdatenabgleich im Millisekundenbereich, 0 CU Inferenz, Null Halluzinationsrisiko. |\n| **Decide** | **Evaluator / Reasoner** | **Deterministisch** | **99%** | SAP BRFplus Decision Tables: 100% rechtssichere Regelausf\u00fchrung, revisionssicher nach GoBD. |\n| **Act** | **Executor / Actuator** | **Deterministisch** | **99%** | S/4HANA Clean Core RAP / OData BAPI: Vollautomatische Dunkelverbuchung nach Clean-Core-Standards (`COMPLIANT`). |\n| **Act** | **Generator / Synthesizer** | **Assistant** (`classic_ml`) | **92%** | SAP BTP Output Management: Automatisierte Beleg- und Benachrichtigungsgenerierung im Hintergrund ohne Sachbearbeiter-Stopp. |\n\n---\n\n## 3. Qualitative Effizienz & Vermeidung von Preisspekulation\n\nDa f\u00fcr unternehmensspezifische Szenarien noch keine verbindlichen Token-Preise oder Rollen-Stundens\u00e4tze festgelegt sind, zeigt die Pareto-Optimierung **keine spekulativen Euro-Betr\u00e4ge** an. Stattdessen bewertet das System drei fundierte qualitative Tendenzen:\n\n1. **Dunkelverarbeitung (STP):** `\u25b2 Signifikant gesteigert`  \n   Der Belegfluss wird von k\u00fcnstlichen Stopps befreit und l\u00e4uft durchgehend automatisiert.\n2. **Token- & Modell-Bedarf:** `\u25bc Stark reduziert`  \n   Deterministische Fast-Paths und In-Memory Fuzzy Search eliminieren unn\u00f6tige LLM-Aufrufe.\n3. **Ressourcen-Tendenz:** `\u25bc Deutlich g\u00fcnstiger`  \n   Sub-Sekunden-Latenz und massive Entlastung des operativen Personals von repetitiven Standardf\u00e4llen.\n\n---\n\n## 4. Step-Boxen, Live-Simulation & Human-in-the-Loop Konsole\n\nJeder Schritt im Workflow bietet eine vollst\u00e4ndige Einsicht:\n- **Header:** Schrittnummer, Name, kognitives Primitiv und SAP-Schnittstellen-Referenz.\n- **Zwingmann-Leiste:** Interaktives Umschalten zwischen den 5 Archetypen inklusive `(\u2139\ufe0f)`-Erkl\u00e4rungen.\n- **Live-Simulation:** Play-Button startet den Beleglauf von Schritt 1 bis 6 mit Latenz-Simulation.\n- **HITL-Konsole (Human-in-the-Loop):**\n  - Wird ein Schritt auf **Copilot** konfiguriert (z. B. zur Demonstration manueller Kontrollen vor der Pareto-Optimierung), stoppt die Simulation gezielt.\n  - Der Sachbearbeiter kann \u00fcber `[Freigeben & Weiter]`, `[Manuell anpassen]` oder `[Ablehnen]` interaktiv entscheiden.\n  - Ein Klick auf `[ Reales JSON anzeigen ]` zeigt die exakte Payload-Struktur f\u00fcr Entwickler.\n\n---\n\n## 5. Eigener Workflow Creator (`+ Neuer Workflow`)\n\n\u00dcber den Header-Button `[+ Neuer Workflow]` k\u00f6nnen beliebige neue Prozesse definiert werden:\n1. **Schnell-Start Presets:**\n   - *Rechnungseingangspr\u00fcfung (MIRO / Scope 2B6)*\n   - *Lieferanten-Reklamation & QM-Meldung (Scope PR01)*\n2. **Freitext-Dekomposition:**\n   - Eingabe einer formlosen Beschreibung eines Prozesses.\n   - Automatische Zerlegung in die 4 OODA-Phasen und Zuordnung zu den 6 kognitiven Primitives.\n   - Sofortiges Laden als aktiver, simulierbarer Workflow im Simulator.\n\n---\n\n## 6. Zweisprachigkeit (\ud83c\udde9\ud83c\uddea DE / \ud83c\uddec\ud83c\udde7 EN)\n\n\u00dcber den Umschalter `[ \ud83c\udde9\ud83c\uddea DE | \ud83c\uddec\ud83c\udde7 EN ]` im Header wird das gesamte System zur Laufzeit \u00fcbersetzt:\n- Alle Navigationselemente, Step-Karten, Badges und Kriterienleisten.\n- Prozessinhalte, Beschreibungen und SAP-Referenzen.\n- Live-Payloads und Log-Meldungen.\n- Die gesamte Schulungsmatrix und alle modale Erkl\u00e4rungen.\n\n---\n\n## 7. Projekt-Ressourcen, Logfiles & Roadmaps\n\n- \ud83d\udccb **[LOGFILE.md](LOGFILE.md):** Chronologisches Entwickler- und Session-Log aller Fehlerbehebungen und Implementierungen.\n- \ud83d\uddfa\ufe0f **[ROADMAP.md](ROADMAP.md):** Strategische Produkt-Roadmap mit allen abgeschlossenen (M1\u2013M4) und geplanten (M5\u2013M8) Meilensteinen.\n- \ud83c\udf93 **[docs/METHODIK_SCHULUNGSLEITFADEN.md](docs/METHODIK_SCHULUNGSLEITFADEN.md):** Detaillierter Leitfaden f\u00fcr Workshops und SAP-Architektur-Schulungen.\n- \ud83d\udcda **[docs/steps/](docs/steps/README.md):** Didaktische Schritt-Dossiers zu jedem einzelnen Prozessschritt (1 bis 6) inkl. SAP-Tabellen, BAPIs, 5-Archetypen-Vergleich und Pr\u00fcfungsfragen.\n",
      roadmap: "# Projekt-Roadmap: SAP Process Simulator & Advisory Suite\n\nDiese Roadmap visualisiert den strategischen Entwicklungsplan, bereits abgeschlossene Meilensteine und die geplanten Ausbaustufen des SAP Process Simulators.\n\n---\n\n## \ud83d\uddfa\ufe0f Meilenstein-\u00dcbersicht\n\n```\n[ v1.0 Kernarchitektur ] \u2500\u2500\u25ba [ v1.1 Interaktive HITL ] \u2500\u2500\u25ba [ v1.2 Methodenmatrix & i18n ]\n         \u2502\n         \u25bc\n[ v1.3 Workflow Creator & Qualitative Pareto ] \u2500\u2500\u25ba [ v1.4 OODA-Primitives Optimum (Aktuell) ]\n         \u2502\n         \u25bc (Geplante Ausbaustufen)\n[ v2.0 Granular Pricing & Sizing ] \u2500\u2500\u25ba [ v2.1 Import/Export & Signavio ] \u2500\u2500\u25ba [ v2.2 SAP BTP Live-Bridge ]\n```\n\n---\n\n## \u2705 Abgeschlossene Meilensteine\n\n### Meilenstein 1 (v1.0): Fundament & SAP Clean Core Architektur\n- [x] **OODA-Dekomposition:** Zerlegung von SAP-Standardprozessen (BD9, 2F1, J60) in *Observe*, *Orient*, *Decide* und *Act*.\n- [x] **6 Kognitive Primitives:** Filter/Gatekeeper, Extractor/Transformer, Matcher/Enricher, Evaluator/Reasoner, Executor/Actuator, Generator/Synthesizer.\n- [x] **5 Zwingmann-Archetypen:** Deterministisch (BRFplus), Assistant (Klassisches ML/Search), Copilot (Joule), Autopilot (Single-Agent), Agentic (Multi-Agent Swarm).\n- [x] **Schutzplanken & Blast Radius:** Reversibilit\u00e4tsscores (1\u20135) und Clean Core Compliance Index (`COMPLIANT`, `LEGACY`, `VIOLATION`).\n- [x] **13 Risikochallenges:** Reaktiv getriggerte Risiken und Mitigationsstrategien nach 4 Clustern.\n\n### Meilenstein 2 (v1.1): Interaktive Simulation & Human-in-the-Loop Konsole\n- [x] **Live-Simulation:** Animierter Beleglauf mit Play-, Pause- und Taktzeitsteuerung.\n- [x] **HITL-Entscheidungskonsole:** Interaktive Freigabe-Box bei Copilot-Schritten (`Freigeben & Weiter`, `Manuell anpassen`, `Ablehnen`).\n- [x] **Kompaktes Workflow-Design:** Responsives Tabellendesign mit zentriertem Layout auf Gro\u00dfbildschirmen.\n- [x] **Dezente Statusmeldungen:** Beseitigung redundanter Fehlalarme zugunsten pr\u00e4ziser Status-Badges.\n\n### Meilenstein 3 (v1.2): Methodik-Schulung & Zweisprachigkeit\n- [x] **Methodik-Schulungsmatrix:** Vollst\u00e4ndige 3-Ebenen-\u00dcbersicht (OODA, Primitives, Zwingmann-Tiers).\n- [x] **Interaktive `(i)`-Badges:** Modale Erl\u00e4uterungsfenster f\u00fcr Ausf\u00fchrungselemente, OODA-Phasen und Primitives-Steuerparameter.\n- [x] **Copilot-Schulungsunterlage:** Explizite Dokumentation der drei legitimen Copilot-Einsatzf\u00e4lle (Compliance/SOX, Ermessen/Kulanz, St\u00fctzr\u00e4der).\n- [x] **Laufzeit-Lokalisierung (\ud83c\udde9\ud83c\uddea DE / \ud83c\uddec\ud83c\udde7 EN):** Zentrales i18n-Modul mit synchronisierter Sprachumschaltung f\u00fcr alle Oberfl\u00e4chen, Templates und Payloads.\n\n### Meilenstein 4 (v1.3 & v1.4): Workflow Creator & Echtes Pareto-Optimum\n- [x] **Qualitative Pareto-Optimierung:** Ersatz spekulativer Euro-Preise durch relative Tendenzen (Dunkelverarbeitung, Token-Bedarf, Ressourceneffizienz).\n- [x] **Workflow Creator Modal (`+ Neuer Workflow`):** Vordefinierte Presets (MIRO 2B6, QM Claim PR01) und Freitext-Dekomposition beliebiger Prozesse.\n- [x] **Pareto-Solver \u00dcberarbeitung:**\n  - Beseitigung fehlerhafter Copilot-Zuweisungen auf den Schritten 1, 2 und 6.\n  - Echte 100% Dunkelverarbeitung (Straight-Through Processing / STP) im Optimum.\n  - Pr\u00e4zise Zuordnung aller 6 Primitives:\n    - *Filter / Gatekeeper:* Deterministisch (Fast-Path, 0 Tokens, 99%)\n    - *Extractor / Transformer:* Assistant (SAP DOX / LLM JSON-Mode im Hintergrund, 92%)\n    - *Matcher / Enricher:* Assistant (SAP HANA Trigram & Fuzzy Search, 95%)\n    - *Evaluator / Reasoner:* Deterministisch (SAP BRFplus Decision Tables, 99%)\n    - *Executor / Actuator:* Deterministisch (S/4HANA Clean Core RAP / OData BAPI, 99%)\n    - *Generator / Synthesizer:* Assistant (SAP BTP Output Management im Hintergrund, 92%)\n- [x] **TCA-Kalkulation f\u00fcr Fast-Paths:** Deterministische Gatekeeper erzielen realistische 95\u201399% Automationsgrad ohne unberechtigten Schemadivergenz-Abzug.\n\n### Meilenstein 5 (v1.5): SAP AI Core Calculator MCP-Server & Schritt-Empfehlungs-Engine\n- [x] **Live-Katalog-Daten:** Vollst\u00e4ndiger Datenabzug der 81 offiziellen SAP AI Core Foundation Models & 8 Templates aus dem BTP Cost Calculator.\n- [x] **Lokaler Node/TypeScript MCP-Server (`sap-ai-core-calculator-mcp`):**\n  - Stdio JSON-RPC Dienst mit 4 Tools (`ai_core_list_models`, `ai_core_get_templates`, `ai_core_recommend_step_setting`, `ai_core_calculate_step_costs`).\n  - Tool-Schemas in `/home/peter/.gemini/antigravity/mcp/sap-ai-core-calculator/` hinterlegt.\n- [x] **Kontextsensitive Schritt-Empfehlungs-Engine (`aiCoreAdvisor.ts`):**\n  - Automatische Ableitung von Modell, BTP-Orchestrierung (Data Masking, Content Filter, Grounding) und Template-Preset je nach Schritt, Primitive und Archetyp.\n- [x] **UI-Integration im Simulator:**\n  - Neue Sektion *\u201e\ud83d\udca1 SAP AI Core Architektur-Empfehlung & Template-Zuordnung\u201c* in `StepImpactCriteria.tsx`.\n  - Schneller Modell-Indikator direkt auf jeder `StepCard.tsx`.\n  - Vollst\u00e4ndige Zweisprachigkeit (\ud83c\udde9\ud83c\uddea DE / \ud83c\uddec\ud83c\udde7 EN).\n\n---\n\n## \ud83d\ude80 Geplante Meilensteine (Future Releases)\n\n### Meilenstein 5 (v2.0): Granulares BTP-Pricing & Rollenbezogenes Sizing\n*Ziel: Fundierte, reale Kostenkalkulation nach offiziellen SAP Preismodellen.*\n- [ ] **SAP Capacity Unit (CU) & AI Unit Konfigurator:**\n  - Konfigurierbare Preise f\u00fcr BTP AI Units (LLM Tokens per 1k Input/Output) und BTP Document Information Extraction (DOX) pro Seite.\n- [ ] **Rollenbasierte Stundens\u00e4tze:**\n  - Differenzierung der Human-in-the-Loop Kosten nach Rollen (z. B. Junior Sachbearbeiter: 45 \u20ac/h, Senior Disponent: 70 \u20ac/h, Fachexperte/Jurist: 120 \u20ac/h).\n- [ ] **Break-Even & ROI Rechner:**\n  - Visualisierung des Amortisationszeitpunkts f\u00fcr Clean Core Refactoring vs. Legacy-Betrieb.\n\n### Meilenstein 6 (v2.1): Workflow-Export, Import & SAP Signavio Br\u00fccke\n*Ziel: Interoperabilit\u00e4t und kollaborativer Austausch von Prozessmodellen.*\n- [ ] **JSON/YAML Import & Export:**\n  - Speichern, Teilen und Laden von selbst erstellten Workflows als strukturierte Dateien.\n- [ ] **BPMN 2.0 / SAP Signavio Parser:**\n  - Automatischer Import von Standard-BPMN-XML aus SAP Signavio Process Manager.\n  - Automatisches Mapping von BPMN-Tasks auf OODA-Phasen und Primitives.\n- [ ] **PDF-Management-Report Export:**\n  - Export druckfertiger Architektur-Entscheidungsvorlagen f\u00fcr Lenkungsaussch\u00fcsse und Enterprise Architects.\n\n### Meilenstein 7 (v2.2): SAP BTP AI Core & Joule Live-Bridge\n*Ziel: Optionale Anbindung realer SAP-Services zur Live-Validierung.*\n- [ ] **BTP AI Core Verbindung:**\n  - Optionaler API-Key-Modus f\u00fcr Live-Extraktion \u00fcber SAP DOX oder GenAI Hub (z. B. Claude 3.5 Sonnet / GPT-4o \u00fcber BTP).\n- [ ] **SAP Event Mesh Webhook Receiver:**\n  - Live-Einspeisung echter Test-Ereignisse aus SAP S/4HANA Cloud in die Simulator-Pipeline.\n- [ ] **Joule Prompt Preview:**\n  - Automatische Generierung der passenden SAP Joule Copilot Prompt-Vorlagen f\u00fcr Schritte mit HITL.\n\n### Meilenstein 8 (v2.3): Monte-Carlo Simulation & Stresstest-Generator\n*Ziel: Statistische Absicherung vor Produktivstart.*\n- [ ] **Monte-Carlo Rausch-Simulation:**\n  - Tausendfacher Durchlauf mit variablen Rauschmustern zur Ermittlung statistischer Ausfallwahrscheinlichkeiten.\n- [ ] **Prompt Injection & Adversarial Testing:**\n  - Automatisierter Test gegen CH_08 (Direct Prompt Injection) in unstrukturierten Freitexten.\n- [ ] **Thread Lock & API Rate-Limit Stresstest:**\n  - Simulation von Lastspitzen (Monatsabschluss) zur Dimensionierung von SAP AI Core Concurrency Quotas.\n",
      methodik: "# Methodik- & Schulungsleitfaden: Kognitive Prozessautomatisierung in SAP\n\nDieses Dokument dient als Schulungsunterlage und Architektur-Referenz f\u00fcr das Zusammenspiel aus **OODA-Loop**, **Kognitiven Primitives**, der **Zwingmann-Methodologie** und dem gezielten Einsatz von **Human-in-the-Loop (Copilot)** in modernen SAP S/4HANA & BTP Architekturen.\n\n---\n\n## 1. Die 3-Ebenen-Hierarchie der Automatisierung\n\nJeder Gesch\u00e4ftsprozess im Simulator folgt einer dreistufigen Hierarchie, die sicherstellt, dass Gesch\u00e4ftslogik, kognitive Aufgaben und technische Ausf\u00fchrungsarten sauber entkoppelt sind:\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 EBENE 1: Der Kognitive OODA-Loop                                       \u2502\n\u2502 [Observe] \u2794 [Orient] \u2794 [Decide] \u2794 [Act]                                \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                    \u2502 bestimmt den Prozessfortschritt\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 EBENE 2: Die 6 Kognitiven Primitives                                   \u2502\n\u2502 Filter \u2794 Extractor \u2794 Matcher \u2794 Evaluator \u2794 Executor \u2794 Generator        \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                    \u2502 definiert die fachliche Aufgabe\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 EBENE 3: Die 5 Ausf\u00fchrungsarten (Zwingmann-Archetypen)                 \u2502\n\u2502 1. Deterministisch \u2502 2. Assistant \u2502 3. Copilot \u2502 4. Autopilot \u2502 5. Ag. \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 2. Ebene 1: Der OODA-Loop im SAP-Kontext\n\nUrspr\u00fcnglich von John Boyd f\u00fcr adaptive Entscheidungszyklen entwickelt, beschreibt der OODA-Loop, wie ein autonomes oder KI-unterst\u00fctztes System mit der Umwelt interagiert:\n\n### 1. Observe (Wahrnehmung & Reizaufnahme)\n* **Aufgabe:** Eingehende Rohdaten abfangen (E-Mails, PDF-Bestellungen, EDI-Dateien, Kundenportal-Anfragen).\n* **Zweck:** Rauschen, Spam und Duplikate sofort aussortieren; Rohinhalte f\u00fcr die Weiterverarbeitung digitalisieren.\n* **SAP BTP Schnittstelle:** SAP Event Mesh, Cloud Integration (CPI), Document Information Extraction (DOX).\n\n### 2. Orient (Kontextualisierung & Grounding)\n* **Aufgabe:** Abgleich der erkannten Entit\u00e4ten gegen das Unternehmensged\u00e4chtnis (SAP Stammdaten).\n* **Zweck:** Verhindert KI-Halluzinationen. Eine Modell-Aussage wie *\u201eKunde M\u00fcller will Flansche\u201c* wird mit realen Tabellen verkn\u00fcpft: Debitor `0000100420` (KNA1), Material `FL-9021` (MARA), Servicevertrag `SV-88102`.\n* **SAP BTP Schnittstelle:** SAP HANA Cloud Vector Engine, Core Data Services (CDS Views), OData v4 Lookup.\n\n### 3. Decide (Regelpr\u00fcfung & Richtlinien)\n* **Aufgabe:** Betriebswirtschaftliche Bewertung und Pr\u00fcfung von Schutzplanken (Guardrails).\n* **Zweck:** Sch\u00fctzt vor unkontrollierten Risiken: Reicht das Kreditlimit? Gilt die Gew\u00e4hrleistung? Liegt der Auftragswert \u00fcber der Freigabegrenze?\n* **SAP BTP Schnittstelle:** SAP Build Process Automation Decision Service (BRFplus / DMN), Credit Management.\n\n### 4. Act (ERP-Mutation & Systeminteraktion)\n* **Aufgabe:** Schreibende, persistente Zustands\u00e4nderung im SAP-Kernsystem und Abschlusskommunikation.\n* **Zweck:** Der rechtlich bindende Commit (z. B. Kundenauftrag SO01 anlegen, FI-Zahlung buchen) und Versand der Auftragsbest\u00e4tigung.\n* **SAP BTP Schnittstelle:** S/4HANA ABAP Cloud RAP (RESTful Application Programming Model), SAP Forms by Adobe.\n\n---\n\n## 3. Ebene 2: Die 6 Kognitiven Primitives & ihre Steuerparameter\n\nUnabh\u00e4ngig von Branche und Fachbereich l\u00e4sst sich jeder Arbeitsschritt auf genau 6 kognitive Primitives abbilden:\n\n| Primitiv | Kognitive Aufgabe | Wesentliche Steuerparameter |\n| :--- | :--- | :--- |\n| **1. Filter / Gatekeeper** | Triage, Spam-Schutz, Vorfilterung | `Relevanz-Schwellwert (0.0-1.0)`, `Format-Schema`, `Duplikat-Pr\u00fcffenster`, `Quarant\u00e4ne-Queue` |\n| **2. Extractor / Transformer** | Freitext/PDF in Belegdaten \u00fcberf\u00fchren | `JSON-Schema`, `Feld-Konfidenz-Gate`, `OCR-Engine`, `Normalisierungs-Regeln` |\n| **3. Matcher / Enricher** | Stammdaten-Aufl\u00f6sung & Grounding | `Matching-Strategie (Exakt/Fuzzy/Vektor)`, `Fuzzy-Threshold (>=0.85)`, `Stammdaten-Objekt (KNA1/MARA)` |\n| **4. Evaluator / Reasoner** | Policy- & Gesch\u00e4ftsregel-Pr\u00fcfung | `DMN-Entscheidungstabelle`, `Betragsgrenzen (Delegation of Authority)`, `Eskalations-Matrix` |\n| **5. Executor / Actuator** | Schreibende ERP-Mutation (Commit) | `S/4HANA RAP Endpoint`, `Idempotenz-Schl\u00fcssel`, `Blast Radius (1-5)`, `Clean Core Index` |\n| **6. Generator / Synthesizer** | Best\u00e4tigungen & Dokumentenerstellung | `Ausgabekanal (Mail/PDF/Portal)`, `Tonalit\u00e4t`, `Beleg-Referenz-Binding`, `Genehmigungspflicht` |\n\n---\n\n## 4. Ebene 3: Die 5 Ausf\u00fchrungsarten (Zwingmann-Methodologie)\n\nDie Ausf\u00fchrungsart legt fest, **welche Technologie** eingesetzt wird und **wie sich der Beleg im Prozessfluss verh\u00e4lt**:\n\n```\nDurchsatz (STP)            Latenz & Kosten              Technologie\n100% STP (Dunkel)    \u2502  < 50 ms   \u2502 0 CU           \u2502 Deterministisch (BRFplus/SQL)\n100% STP (Dunkel)    \u2502  ~ 380 ms  \u2502 0.02 CU        \u2502 Assistant (LLM Prompt-in/Text-out)\n  0% STP (Stoppt)    \u2502  ~ 650 ms  \u2502 0.02 CU + Lohn \u2502 Copilot (Joule / Human-in-the-Loop)\n ~90% STP (Bedingt)  \u2502  ~ 1.450 ms\u2502 0.08 CU        \u2502 Autopilot (Single-Agent + Gate)\n ~95% STP (Autonom)  \u2502  ~ 3.800 ms\u2502 0.40 CU        \u2502 Agentic Swarm (Multi-Agent ReAct)\n```\n\n---\n\n## 5. Das Copilot-Dilemma: Warum Copilot in einem automatisierten Workflow?\n\n### Das scheinbare Paradoxon:\nEin Workflow hat das Ziel: **Dunkelverarbeitung (Straight-Through Processing / STP)** \u2013 Daten sollen ohne menschliche Ber\u00fchrung von A nach B flie\u00dfen.\nEin Copilot hingegen **stoppt den Prozess ganz bewusst** und wartet auf eine menschliche Aktion (`human_approved: true`). Rechnerisch sinkt die Dunkelverarbeitungsquote dieses Schritts auf **0%**.\n\n### Warum setzen Enterprise-Architekten Copiloten dennoch gezielt ein?\n\nEs gibt **drei fundamentale Business- und Governance-Gr\u00fcnde**:\n\n#### 1. Compliance, SOX & Haftung (Das Vier-Augen-Prinzip)\n* **Problem:** Rechtsverbindliche Handlungen mit hohem finanziellem oder juristischem Risiko d\u00fcrfen laut Gesetz (SOX, GoBD, IFRS, Medizinprodukte-Verordnung) oder internen Unterschriftenrichtlinien (*Delegation of Authority*) **nicht vollautomatisch von einer KI gezeichnet werden**.\n* **Beispiele:**\n  * Bestellfreigaben > 50.000 \u20ac\n  * Stornierung von Vertr\u00e4gen\n  * Zuteilung von Gefahrgut oder pharmazeutischen Wirkstoffen\n  * Entlassungen oder Disziplinarma\u00dfnahmen\n* **L\u00f6sung durch Copilot:** Der Copilot nimmt dem Sachbearbeiter 90% der manuellen Arbeit ab (Zusammenfassung lesen, historische Belege matchen, Risiko analysieren). Der Sachbearbeiter pr\u00fcft die Vorlage in 10 Sekunden und setzt seine rechtsverbindliche Unterschrift.\n\n#### 2. Ermessensspielraum & Kulanzentscheidungen\n* **Problem:** Viele Gesch\u00e4ftsentscheidungen haben keine bin\u00e4re Wenn-Dann-Wahrheit.\n* **Beispiel:** Ein ver\u00e4rgerter A-Kunde fordert nach Lieferverz\u00f6gerung einen Sondernachlass von 5%. Ein starres Regelwerk w\u00fcrde ablehnen; eine autonome KI k\u00f6nnte unkontrolliert Marge vernichten.\n* **L\u00f6sung durch Copilot:** SAP Joule analysiert den Kundenwert (LTV), den Deckungsbeitrag des laufenden Jahres und schl\u00e4gt vor: *\u201eKunde erwirtschaftet 1,2 Mio. \u20ac Umsatz. Kulanznachlass von 350 \u20ac wird zur Kundenerhaltung empfohlen.\u201c* Die finale Freigabe erteilt der Vertriebsleiter.\n\n#### 3. Das Reifegrad-Modell (\u201eSt\u00fctzr\u00e4der vor dem Autopiloten\u201c)\n* **Problem:** Bei der Ersteinf\u00fchrung von Machine Learning oder LLMs vertraut keine Unternehmensleitung dem Modell am Tag 1 eine un\u00fcberwachte Dunkelverarbeitung an.\n* **Rollout-Phasen:**\n  * **Phase 1 (Monat 1\u20133) \u2013 Copilot-Modus:** Jeder Beleg wird der Fachabteilung als Joule-Vorschlag vorgelegt. Der Mensch pr\u00fcft 100% der F\u00e4lle. Gleichzeitig werden Metriken gesammelt (Acceptance Rate).\n  * **Phase 2 (Monat 4\u20136) \u2013 Autopilot-Modus:** Nachgewiesen liegt die KI bei 99,2% Genauigkeit. Nun wird auf **Autopilot** umgeschaltet: Alle Belege mit Konfidenz >= 85% laufen dunkel durch. Nur die verbleibenden 0,8% Grenzf\u00e4lle stoppen noch zur manuellen Kl\u00e4rung.\n\n---\n\n## 6. Die Human-in-the-Loop (HITL) Interaktion im Simulator\n\nIm Simulator wurde das passive Stopp-Signal durch eine echte **Entscheidungskonsole** ersetzt:\n\n1. **Joule KI-Vorschlag:** Zeigt die erkannten Daten und die berechnete Konfidenz.\n2. **Interaktive Optionen des Sachbearbeiters:**\n   * **`[\u2713 Freigeben & Weiter]`**: Der Beleg wird mit den vorgeschlagenen Werten freigegeben. Die Simulation setzt ihren Lauf automatisch zum n\u00e4chsten Schritt fort.\n   * **`[\u270f\ufe0f Manuell anpassen]`**: Der Sachbearbeiter \u00fcbersteuert Werte oder erfasst einen Revisionsvermerk (z. B. *\u201eKunde telefonisch erreicht, Skonto gew\u00e4hrt\u201c*).\n   * **`[\u2715 Ablehnen]`**: Der Beleg wird gestoppt und als abgewiesen gekennzeichnet.\n3. **Simulations-Verhalten:**\n   Startet man die Simulation \u00fcber *\u201eDurchlauf testen\u201c*, stoppt sie bei Erreichen eines Copilot-Schritts sanft (*\u201e\u23f8\ufe0f Human-in-the-Loop: Wartet auf Sachbearbeiter-Freigabe\u201c*). Erst durch den Klick auf *Freigeben* l\u00e4uft der Prozess weiter.\n\n---\n\n## 7. Zusammenfassung f\u00fcr Schulungen & EAM-Reviews\n\n* **Merksatz 1:** Ein einziger Copilot-Schritt im Workflow verhindert 100% Dunkelverarbeitung \u2013 er ist aber oft die einzige gesetzeskonforme L\u00f6sung.\n* **Merksatz 2:** Der Copilot ist das ideale Werkzeug f\u00fcr Phase 1 des KI-Rollouts. Das Zielbild f\u00fcr Standardprozesse ist der **Autopilot** (Dunkelverarbeitung mit Ausnahme-Gate).\n* **Merksatz 3:** Vor der Systemmutation (Act) muss immer ein Grounding (Orient) gegen SAP Stammdaten stattfinden, um Halluzinationen auszuschlie\u00dfen.\n\n---\n\n## 8. \ud83e\udded Terminologie-Kompass: Zwingmann-Autonomie vs. SAP Joule Begrifflichkeiten\n\nIn der industriellen Praxis und in universit\u00e4ren Vorlesungen f\u00fchrt das Aufeinandertreffen wissenschaftlicher KI-Taxonomien und SAP-Produktmarketing regelm\u00e4\u00dfig zu Missverst\u00e4ndnissen. \n\n### Der scheinbare Widerspruch beim Begriff \u201eAssistant\u201c:\n* **In der Zwingmann-Methodologie:**  \n  Ein **Assistant (Stufe 2)** ist die **einfachste KI-Auspr\u00e4gung**: Ein isolierter, zustandsloser **Single-Turn-Aufruf** (Request \u2794 Response ohne Dialog, ohne Ged\u00e4chtnis und ohne Tool-Calling). Beispiele: SAP DOX Belegextraktion, HANA In-Memory Fuzzy Search, Text\u00fcbersetzung via GenAI Hub.\n* **In der offiziellen SAP-Produktwelt:**  \n  Als **Joule Digital Assistant** bezeichnet SAP hingegen den **\u00fcbergeordneten Supervisor / Dirigenten** im Fiori Launchpad, der Benutzeranfragen entgegennimmt, zerlegt und an spezialisierte Fachagenten delegiert.\n\n### Rosetta-Stone: Die \u00dcbersetzungstabelle\n\n| Zwingmann-Stufe (Kognitions-Kybernetik) | Name im Simulator | Offizielles SAP BTP / S/4HANA \u00c4quivalent | Didaktischer Merksatz |\n|---|---|---|---|\n| **1. Deterministisch** | **Deterministisch** | SAP S/4HANA Core / BRFplus / RAP / SQL | 0 CU, 0 Tokens, 100% GoBD- & revisionssicher |\n| **2. Single-Turn ML** | **Single-Turn ML** | SAP GenAI Hub API / SAP DOX / Classic ML | Isolierter, zustandsloser API-Call (Prompt \u2794 Text/JSON); **kein** Dialog |\n| **3. Copilot** | **Copilot** | SAP Joule Sidepanel / Fiori Freigabe-Workflow | Human-in-the-Loop (`human_approved: true`); stoppt Belegfluss f\u00fcr SOX |\n| **4. Workflow** | **Workflow** | **SAP Build Process Automation / n8n Flow** | **Echte Workflow-Orchestrierung** (~90\u201395% STP) mit Schwellwertpr\u00fcfung & Kl\u00e4rungs-Queue |\n| **5. Autonomous Agent** | **Autonomous Agent** | **SAP Joule AI Agents & Domain-Assistent** | **Autonome Agenten mit MCP-Tools**, gef\u00fchrt von Fachassistenten (z. B. Buchungsassistent) |\n\n> \ud83c\udf93 **Pr\u00fcfungshinweis f\u00fcr Studenten & Enterprise-Architekten:**  \n> 1. **Assistenten vs. Agenten:** In der modernen SAP-Architektur (SAP Autonomous Suite) ist ein **Assistant** (z. B. *Buchungsassistent*, *HR Operations Assistant*) eine \u00fcbergeordnete Fachfunktion, die **5 bis 10 autonome Joule Agents** f\u00fchrt. Die Agenten f\u00fchren die Aufgaben autonom \u00fcber MCP-Tools aus.\n> 2. **Workflows:** Es gibt keinen fiktiven \u201eAutonomous Flow\u201c \u2013 standardisierte Abl\u00e4ufe laufen \u00fcber **SAP Build Process Automation** oder Workflow-Engines wie **n8n**.\n> 3. **Single-Turn:** Was Zwingmann historisch als \u201eAssistant\u201c bezeichnete, ist in SAP ein reiner zustandsloser Single-Turn Aufruf \u00fcber den **SAP GenAI Hub** oder **SAP DOX**.\n\n",

ise) wird als gegebene Zielplattform vorausgesetzt, ohne unn\u00f6tigen Programmier-Chinesisch-Ballast.\n2. **Neues didaktisches 6-S\u00e4ulen-Dossier f\u00fcr alle 6 Prozessschritte (`docs/steps/`)**:\n   - `docs/steps/README.md`: \u00dcberarbeiteter Leitfaden mit Fokus auf OODA, Kognitive Primitive und die 5 Automatisierungs-Stufen.\n   - `01_step_email_triage.md`: Der digitale T\u00fcrsteher (Shared Mailbox montags um 08:00 Uhr, Freitext, Spam, Reklamation vs. Bestellung, Elevator Pitch).\n   - `02_step_pdf_extraction.md`: Aus Chaos Daten machen (Layout-Vielfalt, handschriftliche Scans, mehrseitige Tabellen, mathematische Plausibilit\u00e4tspr\u00fcfungen).\n   - `03_step_master_data_matching.md`: Wer ist der Kunde & was will er wirklich? (Kundenmaterialnummern, Tippfehler, Barcodes, Warum generative Halluzinationen hier gef\u00e4hrlich sind).\n   - `04_step_business_rules_credit.md`: Kaufm\u00e4nnische Pr\u00fcfungen & Bonit\u00e4t (Kreditlimit, ATP-Lieferbarkeitspr\u00fcfung, Rabattgrenzen, Warum Copilot hier gl\u00e4nzt).\n   - `05_step_sales_order_creation.md`: Der Nagel mit K\u00f6pfchen \u2013 Der Moment der Wahrheit (Warum Reversibilit\u00e4t 5 kritisch ist, Doppelbuchungsschutz, Stornoroutinen).\n   - `06_step_order_confirmation.md`: Die Visitenkarte des Hauses (Zwei-Zonen-Prinzip: Rechtsverbindliches PDF-Dokument + freundlicher, mehrsprachiger KI-Begleittext).\n3. **Erweiterung der In-App Wissensbasis (`src/data/stepKnowledgeBase.ts`)**:\n   - `businessDecision`: Zentrale Kernfrage, Pr\u00fcfkriterien, Happy Path (Dunkelverarbeitung) und Ausnahmepfad.\n   - `storytellingAndAdvisory`: 30-Sekunden-Elevator-Pitch f\u00fcrs Management, typische Denkfehler von F\u00fchrungskr\u00e4ften & Berater-Antwort, goldene Beraterregel.\n4. **\u00dcberarbeitung des interaktiven Modals (`src/components/Modals/StepKnowledgeModal.tsx`)**:\n   - Tab 2 hei\u00dft nun **\u201ePraxis-Beispiele & Entscheidung\u201c** und zeigt:\n     1. Was kann das in der Praxis alles sein? (P tomation** oder **n8n**; Eliminierung von Fantasiebegriffen wie *\u201eAutonomous Flow\u201c*.\n     - **Zwingmann Stufe 2**: Single-Turn Request-Response API-Calls auf **SAP GenAI Hub** / **SAP DOX** (kein Dialog, kein Assistant im SAP-Sinn).\n2. **Aktualisierung der Schritt-Dossiers (`docs/steps/`)**:\n   - Alle 6 Markdown-Dossiers (`01_step_email_triage.md` bis `06_step_order_confirmation.md`) in Sektion 4 (*Vergleich der 5 Archetypen*) vollst\u00e4ndig auf die reale SAP-Architektur vereinheitlicht:\n     - Spaltenk\u00f6pfe: `1. Deterministisch (BRFplus/RAP)`, `2. Single-Turn ML (GenAI Hub)`, `3. Copilot (Joule HITL)`, `4. Workflow (SAP Build/n8n)`, `5. Autonomous Agent (Joule Agent)`.\n     - Reale Komponenten: SAP Build Process Automation, n8n Flow, SAP DOX, SAP GenAI Hub, SAP AI Core, Joule Sidepanel, Joule AI Agent mit MCP-Gateway.\n3. **Aktualisierung des Simulators (`src/data/zwingmann.ts`, `StepCard.tsx`, Modale)**:\n   - Saubere zweizeilige Tastenbeschriftung mit didaktischer Trennung von Kybernetik und SAP-Produkt.\n   - Aktualisierung aller Archetyp-Texte in `src/data/stepKnowledgeBase.ts`.\n4. **Verifikation & Build**:\n   - `npx tsc --noEmit` fehlerfrei.\n   - `npm run build` erfolgreich abgeschlossen.\n\n---\n\n## [2026-10-03] \u2013 Session 12: Duale Taxonomie & Terminologie-Kompass (Zwingmann vs. SAP Joule)\n\n### Problemstellung & Benutzer-Anforderung:\n> *\u201eSo, jetzt haben wir nat\u00fcrlich noch eine ganz, ganz gro\u00dfe Herausforderung. Wir haben hier die Einteilung nach Zwingmann. Bei uns ist ein Assistant jemand, der nur einen LLM-Aufruf (Request-Response) macht. Ein Copilot ist jemand, der wartet auf die Freigabe, und ein Autopilot ist ein Workflow. Jetzt ist es so, im SAP-Umfeld wird als Assistant einer beschrieben, der mehrere Agenten anf\u00fchrt. Und jetzt ist die Frage, wie wir das auseinandersteuern, wenn wir im SAP-Umfeld sind und verwenden ja die Zwingmann-Definition, was wir machen, aber SAP hat eine andere Begrifflichkeit daf ulator Frontend: `npm run build` kompiliert erfolgreich in 1.6s mit 0 Fehlern.\n\n---\n\n## [2026-10-03] \u2013 Session 5: Pareto-Optimierer \u00dcberarbeitung (OODA & 6 Primitives)\n\n### Benutzer-Anforderung:\n> *\u201eWenn ich Pareto-Optimierung mache, dann kriege ich direkt am Anfang bei E-Mail-Anh\u00e4nge einen Copilot. Das ist doch wohl der gr\u00f6\u00dfte Quatsch. Das sollte nat\u00fcrlich doch hier laufen deterministisch oder per Assistant, aber nicht Copilot-Gr\u00f6\u00dfe, also da stimmt was nicht. Also, geh auf den Simulator und \u00fcberpr\u00fcf alle Prozessschritte von oben nach unten, die hier eingeteilt sind in die entsprechenden OODA-Gr\u00f6\u00dfen (Observe, Orient, Decide, Act) und darunter dann die sechs Primitives: Filter / Gatekeeper, Extractor / Transformer, Matcher / Enricher, Evaluator / Reasoner, Executor / Actuator, Generator / Synthesizer. Bitte optimieren, so dass beim Pareto tats\u00e4chlich das Optimale rauskommt.\u201c*\n\n### Root-Cause-Analyse:\n1. In `src/lib/paretoSolver.ts` war eine fehlerhafte Heuristik hinterlegt, die bei unstrukturierten Eingangsdaten (`isUnstructuredInput = true`) f\u00fcr `Filter / Gatekeeper`, `Extractor / Transformer` und `Generator / Synthesizer` den Archetyp `'copilot'` erzwang.\n2. Dadurch stoppte der Simulator nach der Pareto-Optimierung unmittelbar bei Schritt 1 (Triage) und forderte eine manuelle Sachbearbeiter-Freigabe, anstatt den Beleg im Straight-Through Processing (STP) dunkel durchlaufen zu lassen.\n3. In den Standardvorlagen (`src/data/templates.ts`) starteten BD9 und 2F1 ebenfalls mit Copilot bei Schritt 1.\n4. In `src/lib/tcaCalculator.ts` wurde `deterministic` bei Vorhandensein von `isUnstructuredInput` generell mit 20% Automationsgrad abgestraft (Schemadivergenz), obwohl ein deterministischer Fast-Path-Gatekeeper (SAP Event Mesh / Header-Regex) auf Metadaten arbeitet und 95\u201399% Automationsgrad erreicht.\n\n### Durchgef\u00fchrte \u00c4nderungen:\n1. **`src/lib/paretoSolver.ts` neu - Next.js Production Build:\n  - `npm run build` erfolgreich in 1.0s (0 Fehler).\n\n---\n\n## [2026-10-03] \u2013 Session 4: Qualitative Pareto-Optimierung & Workflow Creator\n\n### Benutzer-Anforderung:\n> *\u201eWir haben keine Preise festgelegt. Wir haben noch keinen Token-Preis festgelegt und wir haben auch noch keine Jugend-in-Loop-Stunde festgelegt. Ich will keine Preise sehen, sondern nur Tendenz teurer oder netter, teurer, mehr Token, weniger Token. Das m\u00fcssen wir erst einbauen, dass wir genau einen Preisvergleich haben. Also bitte wieder raus bei Pareto-Optimierung, dann steht hier der Preis, das will ich nicht sehen. [...] Und dann gehen wir mal auf die Erstellung eines neuen Workflows.\u201c*\n\n### Durchgef\u00fchrte \u00c4nderungen:\n1. **Entfernung spekulativer Euro-Preise**:\n   - Euro-Angaben (`\u20ac/M`, TCA-Differenzen) aus dem Pareto-Ergebnismodalfenster entfernt.\n   - Einf\u00fchrung von 3 qualitativen Effizienzkennzahlen:\n     - **Dunkelverarbeitung (STP):** `\u25b2 Signifikant gesteigert`\n     - **Token- & Modell-Bedarf:** `\u25bc Stark reduziert`\n     - **Ressourcen-Tendenz:** `\u25bc Deutlich g\u00fcnstiger`\n2. **Workflow Creator Modal (`CreateWorkflowModal.tsx`)**:\n   - Neuer Button `[+ Neuer Workflow]` im Header.\n   - Schnell-Start Presets:\n     - *Rechnungseingangspr\u00fcfung (MIRO / Scope 2B6)*\n     - *Lieferanten-Reklamation & QM-Meldung (Scope PR01)*\n   - Freitext-Dekonstruktion: Benutzer gibt einen formlosen Prozess ein, der automatisch in die 4 OODA-Phasen und 6 Primitives zerlegt und als sofort simulierbares Szenario in den Store geladen wird.\n3. **\u00dcbersetzung & i18n**:\n   - Alle Dialoge, Buttons und Erkl\u00e4rungen vollst\u00e4ndig in Deutsch und Englisch \u00fcbersetzt.\n\n---\n\n## [2026-10-02] \u2013 Session 3: Vollst\u00e4ndige Zweisprachigkeit (DE / EN)\n\n### Benutzer-Anforderung:\n> *\u201eDeutsch. So, das ist erstmal ziemlich gut und jetzt h\u00e4tte ich gerne einen Umschalter auf Englisch. Das hei\u0 \u00e4ssig die echten SAP-Werkzeuge.\n  - 1:1 Symmetrie aller Templates (`scope-bd9`, `scope-2f1`, `scope-j60`) in Deutsch und Englisch mit vollst\u00e4ndigen `sapGoldenPathTool`-, `sapGoldenPathGraph`- und `euAiActRisk`-Annotationen.\n\n---\n\n## [2026-10-03] \u2013 Session 16: Radikale Didaktik auf Ebene 1 (Input \u2794 Intention \u2794 Output) & Die 3 Leitfragen (Kosten, Risiko, Lizenzen)\n\n### Benutzer-Anforderung:\n> *\u201eAuf der ersten Ebene m\u00f6chte ich einfach nur, dass man den Prozess ganz einfach verstehen kann. Und sieh, das ist der Prozess, das ist eingehen, das ist ausgehen, und keine Konsequenzen, dass man einfach sieht, was Sache ist. Es muss sehr einfach sein und immer komplexer je nach Step, und jeder Step muss eine bestimmte fachliche Intention haben. Will ich die Kosten wissen? Will ich das Risiko wissen? Will ich wissen, welche Tools ich dazu lizenzieren muss? Das sind ganz klare Kriterien, die dann da letztlich mit in Betracht gezogen werden m\u00fcssen.\u201c*\n\n### Durchgef\u00fchrte Arbeiten & Didaktisches Konzept:\n1. **Erweiterung des Datenmodells (`src/types/process.ts`)**:\n   - `ProcessStep` um 4 didaktische Kernfelder erweitert:\n     - `businessIntent`: Klare betriebswirtschaftliche Intention (Warum gibt es diesen Schritt?).\n     - `inputDescription`: Was flie\u00dft konkret hinein? (z. B. Kunden-E-Mail mit 2-seitigem Bestell-PDF).\n     - `outputDescription`: Was kommt als Ergebnis heraus? (z. B. Strukturierter JSON-Datensatz oder persistierte SAP-Auftragsnummer).\n     - `requiredLicense`: Welche SAP-Lizenz / BTP-Service ist zur produktiven Nutzung erforderlich?\n\n2. **Template-Anreicherung (DE & EN, `src/data/templates.ts`)**:\n   - Alle 18 Einzelschritte der Kernszenarien (`BD9` Order-to-Cash, `2F1` Service Order Management, `J60` Accounts Receivable Clearing) vollst\u00e4ndig mit verst\u00e4ndlichen, nicht-technischen Beschreibungen f\u00fcr `businessIntent`, `inputDescription`, `outputDescription` und `requiredLicense` ausgestattet.\n\n3. **Neugestaltung der StepCard auf Layer 1 (`flow`) (`src/components/CleanWorkflow/StepCard.tsx`)**:\n   - **Radikale Entlastung**: Die 5 technischen Zwingmann-Buttons werden auf Ebene 1 komplett ausgeblendet, damit Studierende und Fachbereichsentscheider nicht von KI-Architektur-Begriffen erschlagen werden.\n   - **Prominente Fachliche Intention**: Direkt unter dem Step-Namen hebt eine Kachel das gesch\u00e4ftliche Ziel hervor (z. B. *\u201eEingehende E-Mails sichten, Spam herausfiltern und echte Kundenbestellungen isolieren\u201c*).\n   - **Belegfluss-Pipeline**: Zwei Kacheln zeigen auf einen Blick:\n     - \ud83d\udce5 **Eingang**: Eingehender Beleg (z. B. Kunden-E-Mail mit Anhang)\n     - \ud83d\udce4 **Ausgang**: Ausgehendes Zwischenergebnis (z. B. Reines Bestell-PDF)\n   - **Fluss-Zustand & Schnellumschaltung**: Klare Anzeige, ob der Schritt dunkel durchl\u00e4uft (`\u26a1 100% Dunkelverarbeitung`) oder auf menschliche Pr\u00fcfung wartet (`\u23f8\ufe0f Human-in-the-Loop`), mit intuitivem 1-Klick-Umschalter zum direkten Ausprobieren.\n   - Auf den Ebenen 2 (`cost`), 3 (`risk`) und 4 (`architecture`) bleiben die technischen Zwingmann-Schalter und fachspezifischen Tiefenmetriken voll erhalten.\n\n4. **Die 3 Leitkriterien im Detailbereich (`src/components/CleanWorkflow/StepImpactCriteria.tsx`)**:\n   - **Ebene 1 Belegfluss-\u00dcbersicht**: Detaillierte Dreiteilung des Steps in `\ud83d\udce5 Eingang (Input)`, `\ud83c\udfaf Fachliche Intention` und `\ud83d\udce4 Ausgang (Output)`.\n   - **Die 3 Kernfragen als interaktive Kacheln**:\n     1. \ud83d\udcb0 **\u201eWill ich die Kosten wissen?\u201c**: Zeigt sofort BTP Capacity Units pro Beleg (`0 CU` bis `0.003 CU`), Monatskosten und Token-Bedarf. Klick f\u00fchrt direkt in Layer 2.\n     2. \ud83d\udee1\ufe0f **\u201eWill ich das Risiko wissen?\u201c**: Zeigt sofort EU AI Act Klasse (`MINIMAL`/`LIMITED`/`HIGH`), Reversibilit\u00e4t (1\u20135) und finanziellen Blast Radius in \u20ac. Klick f\u00fchrt direkt in Layer 3.\n     3. \ud83d\udce6 **\u201eWelche Tools muss ich lizenzieren?\u201c**: Zeigt sofort die ben\u00f6tigte SAP-Lizenz / SKU (`step.requiredLicense`), das offizielle SAP Tool (`sap-rpt-1`, `SAP Document AI`, `Joule Studio`) und den Golden Path Graph. Klick f\u00fchrt direkt in Layer 4.\n   - **Layer 4**: Prominentes Lizenzierungs-Banner mit offizieller SKU/Cloud-Service-Voraussetzung.\n\n### Verifikation:\n- `npx tsc --noEmit`: 0 Fehler.\n- `npm run build`: Erfolgreicher Next.js 15 Produktions-Build (`Compiled successfully in 1822ms`).\n\n"

    function switchTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-amber-500', 'text-amber-400');
        btn.classList.add('border-transparent', 'text-slate-400');
      });

      const activeTab = document.getElementById('tab-' + name);
      if (activeTab) activeTab.classList.remove('hidden');

      const activeBtn = document.getElementById('tab-btn-' + name);
      if (activeBtn) {
        activeBtn.classList.remove('border-transparent', 'text-slate-400');
        activeBtn.classList.add('border-amber-500', 'text-amber-400');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
